name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "flutter-app/**"
      - "admin-panel/**"
      - ".github/workflows/android-apk.yml"

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Check backend syntax
        run: npm run check:syntax

      - name: Smoke-load Express app
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tikboost
          JWT_ACCESS_SECRET: gha_access_secret_change_me
          JWT_REFRESH_SECRET: gha_refresh_secret_change_me
          ENABLE_GOOGLE_LOGIN: 'false'
          ENABLE_LEGACY_PASSWORD_RESET: 'false'
        run: node -e "const app=require('./src/app'); console.log('backend ok', !!app)"

  build-apk:
    runs-on: ubuntu-latest
    needs: backend-check
    defaults:
      run:
        working-directory: flutter-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate missing Android project files if absent
        run: flutter create . --platforms=android

      - name: Flutter clean
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} \
            --dart-define=SOCKET_URL=${{ vars.SOCKET_URL }} \
            --dart-define=ENABLE_GOOGLE_LOGIN=false \
            --dart-define=ALLOW_LEGACY_PASSWORD_RESET=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tikboost-release-apk
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

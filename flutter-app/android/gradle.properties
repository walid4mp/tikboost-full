org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
# Flutter's own template keeps these two opt-outs while the ecosystem migrates to AGP 9's
# built-in Kotlin. Do not remove them unless every plugin has been migrated.
android.builtInKotlin=false
android.newDsl=false
# AGP 9 no longer keeps default constructors for class-only -keep rules. Libraries that create
# classes by reflection (Room/WorkManager, used by AdMob) then crash at startup. Restore the
# previous behaviour.
android.r8.strictFullModeForKeepRules=false

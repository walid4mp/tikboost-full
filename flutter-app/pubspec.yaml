name: tokaura
description: "TokAura - social rewards and engagement platform"
publish_to: 'none'
version: 1.2.0+5

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  google_mobile_ads: ^6.0.0
  confetti: ^0.8.0
  audioplayers: ^6.5.0
  flutter_local_notifications: ^17.2.4
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/audio/
    - assets/payment_logos/
